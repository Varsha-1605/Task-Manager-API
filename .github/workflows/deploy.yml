name: FastAPI Application Build and Deploy

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: task-manager-api

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Install uv and enable caching
      - name: Setting Up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 2. Install Python
      - name: Setting Up Python
        run: uv python install

      # 3. Synchronize project dependencies from your lockfile
      - name: Install Dependencies
        run: uv sync

      # 4. Build Docker Image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest .
        
      # 5. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Push Docker Image to Docker Hub
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
      
      # 7. Deploy to EC2 Instance
      - name: Deploy to EC2 Instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            # Pull the latest Docker image
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest

            # Stop and remove the existing container 
            docker stop task-manager-api || true
            docker rm task-manager-api || true

            # Run the new container
            docker run -d --name task-manager-api --restart unless-stopped -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest

            # Optional: Clean up dangling images
            docker image prune -f